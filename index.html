<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>sistemRICAL OS</title><link rel="stylesheet" href="style.css"></head><body>
<div id="boot"><div class="bootR">R</div><h1>sistemRICAL</h1><p>Iniciando entorno...</p><div class="loader"><i></i></div></div>
<div id="desktop" hidden><div class="wallpaper"></div><div id="deskIcons" class="deskIcons"></div><div id="windows"></div>
<div id="startMenu" class="panel startMenu"><div class="brand"><b>sistemRICAL</b><span>OS</span><button data-close="startMenu">×</button></div><div class="globalSearch"><span>⌕</span><input id="searchInput" placeholder="Buscar aplicaciones, archivos y ajustes"><button id="voiceBtn">🎙</button></div><div id="searchResults"></div><div class="sectionTitle">Aplicaciones</div><div id="appGrid" class="appGrid"></div><div class="startFooter"><span>● Usuario</span><button id="powerBtn">⏻</button></div></div>
<div id="control" class="panel control"><h2>Centro de control</h2><div class="quick"><button data-toggle="wifi" class="on">⌁<b>Wi‑Fi</b><small>Conectado</small></button><button data-toggle="bt" class="on">◉<b>Bluetooth</b><small>Activado</small></button><button data-toggle="night">☾<b>Modo noche</b><small>Desactivado</small></button><button data-toggle="gaming" class="on">⚡<b>Modo Gaming</b><small>Rendimiento</small></button></div><div class="sliderRow">🔊<input id="volume" type="range" value="70"><b id="volumeVal">70%</b></div><div class="batteryMini"><span>🔋</span><b id="miniBattery">--%</b><small id="miniBatteryState">Detectando batería...</small></div></div>
<div id="notifications" class="panel notifications"><h2>Notificaciones</h2><div class="notice"><b>sistemRICAL</b><p>El sistema está funcionando correctamente.</p></div><div class="notice"><b>Batería</b><p id="batteryNotice">Analizando estado...</p></div></div>
<div id="taskbar"><button id="startBtn" class="task start">R</button><button id="searchBtn" class="task">⌕</button><div id="pinned"></div><div class="grow"></div><div class="tray"><span id="network">⌁</span><span>🔊</span><span id="batteryIcon">▰</span><button id="controlBtn">▢</button><button id="clock"></button></div></div></div>
<script src="app.js"></script></body></html>
